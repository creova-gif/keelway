name: Keelway Infrastructure & Container Deployment

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-infrastructure:
    name: Validate IaC & Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Validate AWS Terraform
        run: |
          cd deploy/terraform/aws
          terraform init -backend=false
          terraform validate

      - name: Validate GCP Terraform
        run: |
          cd deploy/terraform/gcp
          terraform init -backend=false
          terraform validate

      - name: Validate Kubernetes Manifests (Dry-Run)
        run: |
          python3 -c '
          import yaml, glob
          for f in glob.glob("deploy/k8s/*.yaml"):
              with open(f) as stream:
                  list(yaml.safe_load_all(stream))
              print(f"[✓] Validated {f}")
          '

  build-and-scan-container:
    name: Build & Security Scan Container
    runs-on: ubuntu-latest
    needs: [validate-infrastructure]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Local cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}:latest
          load: true

      - name: Verify Container Health Check
        run: |
          docker rm -f test-keelway >/dev/null 2>&1 || true
          trap 'docker logs test-keelway || true; docker rm -f test-keelway >/dev/null 2>&1 || true' EXIT
          docker run -d --name test-keelway \
            -e KEELWAY_POLICY_SIGNING_KEY="ci-ephemeral-policy-signing-key-2026" \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:latest
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container failed health check on http://127.0.0.1:8000/" >&2
            docker ps -a
            exit 1
          fi
          docker exec test-keelway keelway eval-suite --category all --json
          trap - EXIT
          docker rm -f test-keelway
