name: Keelway CI & Governance Gates

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

# Cancel superseded runs on the same ref — protects the monthly Actions
# minute budget on the current plan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Min + max supported versions — the mid-range leg roughly doubled
        # the largest job's minute cost without adding distinct signal.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install bubblewrap (Linux command sandbox)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify Linux Bubblewrap Sandbox Confinement
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-ci.db
          PYTHONPATH: .
        run: |
          python -c "from pathlib import Path; from core.agents.sandbox import Sandbox; sb = Sandbox(Path('.')); assert sb.backend_name == 'bubblewrap', sb.diagnose(); sb.require_verified(); print('Verified:', sb.diagnose())"
          pytest tests/test_agent_sandbox.py -v
      - name: Lint check
        run: ruff check .
      # KEEL-SEC-057 follow-on: tracked-tree secret gate. Scans committed files
      # only; .gitleaks.toml allowlists synthetic fixture markers. Binary pinned
      # by sha256 — bump both fields together when upgrading.
      - name: Secret scan (gitleaks)
        run: |
          set -e
          GL_VER=8.28.0
          GL_SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          echo "${GL_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --config .gitleaks.toml --redact=90 .
      # Profile A + Linux LIVE_OS_ISOLATION_PROOFS. macOS Seatbelt + live Ollama gate runs in release-gate-macos.yml.
      - name: Run Engineering Quality Gates
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-ci.db
          PYTHONPATH: .
          # Subset pytest re-runs inside the gates script duplicate the full
          # `pytest -v` step below — skip them here to protect the minute
          # budget. Syntax/lock/SDK checks still run.
          KEELWAY_GATES_CI_FAST: "1"
        run: ./scripts/verify_engineering_gates.sh
      - name: Run Full Test Suites
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-ci.db
          PYTHONPATH: .
        run: pytest -v

  website-devapp-and-sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            website/package-lock.json
            dev-app/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Build & typecheck Next.js 15 website
        run: |
          npm --prefix website ci
          npm --prefix website run typecheck
          npm --prefix website run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
      - name: Website a11y (axe-core WCAG 2.2 AA) & perf smoke (Playwright)
        run: |
          npx --prefix website playwright install --with-deps chromium
          npm --prefix website run test:e2e
      - name: Compile & test official @keelway/sdk TypeScript package & VS Code/Cursor Bridge Extension
        run: |
          ./website/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json
          npm --prefix sdk/typescript test
          ./website/node_modules/.bin/tsc -p extensions/vscode-keelway/tsconfig.json
          npm --prefix extensions/vscode-keelway test
      - name: Vet & test official keelway-go SDK with race detector
        run: |
          cd sdk/go && go vet ./... && go test ./... -race
      - name: Build & test Unified 10-View Sovereign Dev Tool (Vitest + axe-core WCAG 2.2 AA)
        run: |
          npm --prefix dev-app ci
          npm --prefix dev-app run build
          npm --prefix dev-app test

  wheel-and-sbom-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Build wheel & verify isolated install, SPA assets, Golden Suite, and CycloneDX SBOM
        run: |
          rm -rf dist/
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$GITHUB_WORKSPACE"/dist/keelway-*-py3-none-any.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import pathlib, core; root = pathlib.Path(core.__file__).resolve().parent; assert (root / 'dev_app_dist' / 'index.html').is_file(); assert (root / 'studio' / 'index.html').is_file()"
          /tmp/wheel-venv/bin/keelway eval-suite --category all --json
          /tmp/wheel-venv/bin/python -c "import pathlib; from core.security.sbom import SBOMGenerator, SBOMVerifier; manifest = SBOMGenerator.generate(pathlib.Path('$GITHUB_WORKSPACE')).to_dict(); ok, status, meta = SBOMVerifier.verify(manifest); assert ok and status == 'VERIFIED', (ok, status, meta)"
