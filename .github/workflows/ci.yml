name: Keelway CI & Governance Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap (Linux command sandbox)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint check
        run: ruff check .
      # Profile A only. A green result here is not live verification.
      # python -m tests.release_live_gate is the fail-closed release boundary.
      - name: Run Engineering Quality Gates
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-ci.db
          PYTHONPATH: .
        run: ./scripts/verify_engineering_gates.sh

      - name: Run Full Test Suites
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-ci.db
          PYTHONPATH: .
        run: pytest -v

  release-live-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap (Linux command sandbox)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Fail closed unless every required live proof passed
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-release.db
          PYTHONPATH: .
        run: python -m tests.release_live_gate
