name: Keelway CI & Governance Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint check
        run: ruff check .
      - name: Run Test Suites
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/keelway-ci.db
          PYTHONPATH: .
        run: pytest -v
