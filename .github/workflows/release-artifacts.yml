name: Release Artifacts & CycloneDX SBOM Attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing Git tag to attach release artifacts to (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write
  id-token: write # Sigstore keyless signing (cosign)

jobs:
  build-and-publish-release-artifacts:
    name: Build Wheel, Source Tarball, Verified CycloneDX SBOM & SHA256SUMS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install Python wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/
          python -m pip install dist/*.whl

      - name: Generate and cryptographically verify CycloneDX 1.5 SBOM
        env:
          PYTHONPATH: .
        run: |
          python -c "
          import json
          from pathlib import Path
          from core.security.sbom import SBOMGenerator, SBOMVerifier

          manifest = SBOMGenerator.generate(Path('.')).to_dict()
          ok, status, meta = SBOMVerifier.verify(manifest)
          assert ok and status == 'VERIFIED', (ok, status, meta)
          out_path = Path('dist/keelway-sbom.cdx.json')
          out_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          verified_doc = json.loads(out_path.read_text(encoding='utf-8'))
          ok_disk, status_disk, meta_disk = SBOMVerifier.verify(verified_doc)
          assert ok_disk and status_disk == 'VERIFIED', (ok_disk, status_disk, meta_disk)
          "

      - name: Generate SHA256SUMS.txt
        run: |
          (cd dist && sha256sum *.whl *.tar.gz keelway-sbom.cdx.json > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS.txt (keyless, GitHub OIDC)
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            SHA256SUMS.txt
          # Offline verification customers run:
          #   cosign verify-blob --bundle SHA256SUMS.txt.cosign.bundle \
          #     --certificate-identity-regexp 'https://github.com/creova-gif/kora/' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     SHA256SUMS.txt
          #   sha256sum -c SHA256SUMS.txt

      - name: Upload distributions for PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.whl dist/*.tar.gz dist/keelway-sbom.cdx.json dist/SHA256SUMS.txt dist/SHA256SUMS.txt.cosign.bundle --clobber
          else
            gh release create "$TAG_NAME" dist/*.whl dist/*.tar.gz dist/keelway-sbom.cdx.json dist/SHA256SUMS.txt dist/SHA256SUMS.txt.cosign.bundle --title "Keelway $TAG_NAME" --generate-notes
          fi

  # Publish to PyPI via OIDC trusted publishing. One-time founder setup:
  #   1. pypi.org: create the `keelway` project, add this repo + workflow +
  #      environment `pypi` as a trusted publisher.
  #   2. github repo: create environment `pypi` and set repo variable
  #      PYPI_PUBLISH_ENABLED=true.
  # Until then the job skips; it never uploads without both switches.
  publish-pypi:
    name: Publish wheel & sdist to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: build-and-publish-release-artifacts
    if: github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/keelway
    permissions:
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
