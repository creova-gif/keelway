[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keelway"
version = "0.71.0"
description = "Customer-managed governance and audit platform for AI-powered software change (Sorvex Labs)"
authors = [{ name = "Sorvex Labs Founding Engineering Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
keelway = "keelway.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
