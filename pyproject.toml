[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelway"
version = "1.1.0"
description = "Customer-managed governance and audit platform for AI-powered software change (Sorvex Labs)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "greenlet",
    "httpx>=0.27.0",
    "python-dotenv",
    "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["asyncpg"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
keelway = "cli:main"
keelway-ops = "keelway.cli.main:main"
# Deprecated alias kept for compatibility; emits a deprecation notice at runtime.
keelway-core = "keelway.cli.main:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*", "keelway*", "research*", "evaluations*"]
# keelway_core is the zero-dependency reference engine (ADR-0042): repo-only,
# never shipped in the wheel.
exclude = ["keelway_core*"]

[tool.setuptools.package-data]
core = [
    "studio/*.html",
    "studio/assets/*",
    "studio/assets/**/*",
    "dev_app_dist/*.html",
    "dev_app_dist/assets/*",
    "dev_app_dist/assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".*", "build", "dist", "venv", ".venv"]
filterwarnings = [
    # starlette 1.x nags to install httpx2 for TestClient; httpx2 2.16.x changes
    # streaming semantics that break SSE reconnection (test_studio_realtime_events),
    # so it cannot be adopted yet - scoped suppression (KEEL-REL-063 / D-007).
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
