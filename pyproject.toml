[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelway"
version = "0.1.0"
description = "Sovereign AI Agent Runtime Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "greenlet",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
postgres = ["asyncpg"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
keelway = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*", "research*", "evaluations*"]

[tool.setuptools.package-data]
core = ["studio/*.html", "studio/assets/*", "studio/assets/**/*"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
