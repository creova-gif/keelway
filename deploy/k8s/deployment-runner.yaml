apiVersion: apps/v1
kind: Deployment
metadata:
  name: keelway-runner
  namespace: keelway
  labels:
    app: keelway-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keelway-runner
  template:
    metadata:
      labels:
        app: keelway-runner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: runner
          image: ghcr.io/creova-gif/keelway:latest
          command:
            - python3
            - -m
            - keelway.cli.main
            - runner
            - --runner-id
            - k8s-runner-node
            - --org
            - default-org
            - --server
            - http://keelway-control-plane:8000
            - --repo
            - /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace
      volumes:
        - name: workspace-volume
          emptyDir: {}
