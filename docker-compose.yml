services:
  keelway-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keelway-control-plane
    ports:
      - "8000:8000"
    environment:
      - KEELWAY_POLICY_SIGNING_KEY=${KEELWAY_POLICY_SIGNING_KEY:?set KEELWAY_POLICY_SIGNING_KEY in .env, see env.example}
      - KEELWAY_DB_PATH=/data/keelway_audit.db
      - KEELWAY_STATE_DIR=/data/.keelway
    volumes:
      - keelway-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  keelway-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keelway-platform
    entrypoint: ["uvicorn", "core.main:app", "--host", "0.0.0.0", "--port", "7420"]
    ports:
      - "7420:7420"
    environment:
      - KEELWAY_STATE_DIR=/data/.keelway
      - KEELWAY_DB_PATH=/data/keelway_audit.db
    volumes:
      - keelway-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Outbound customer runner daemon executing in isolated container trust boundary
  keelway-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keelway-runner
    entrypoint: [
      "python3", "-m", "keelway.cli.main", "runner",
      "--runner-id", "container_runner_01",
      "--org", "org_sorvex_demo",
      "--server", "http://keelway-control-plane:8000",
      "--repo", "."
    ]
    depends_on:
      - keelway-control-plane
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Local LLM service option for air-gapped or on-prem execution
  ollama:
    image: ollama/ollama:latest
    container_name: keelway-local-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  keelway-data:
    driver: local
  ollama-models:
    driver: local
